# ============================================================
#  HİSSE RAPORU — AYAR DOSYASI
# ============================================================

baslik: "Hisse Raporu"
# Claude ile yorum yazdırmak için GitHub'da ANTHROPIC_API_KEY sırrı gerekir.
# Anahtar yoksa rapor kural tabanlı şablon metinle yine üretilir.
claude_model: "claude-sonnet-5"
benchmark: SPY

# İsteğe bağlı: makro raporunun adresi (sayfada "← Makro rapor" bağlantısı çıkar). Boş bırakabilirsin.
makro_rapor_url: "https://kurtcebe70.github.io/Makro_Rapor/"

# Her sabah otomatik analiz edilecek hisseler
portfoy: [SPCX, VRT, NVDA, QCOM, ANTW, RKLB, ISRG]
izleme_listesi: [TSM, GEV, PWR, PLTR, NOW, FTNT, AVGO, KLAC, ANET, CRDO,
                 AMD, MU, VST, CEG, TER, CRWD, PANW, MRVL, ETN, SYM,
                 NET, BE, INFQ, PL, KTOS, AVAV, TEM, LMT, ASTS, SMR,
                 NBIS, TSLA, UMAC, ONDS, RCAT, AKAM, EROC, SECZ, LPTH, ONTO,
                 LUNR, ALMU]

# Temalar — ana sayfada gruplama ve filtre için. Listede olmayan hisse "Diğer" grubuna düşer.
# Yeni hisse eklediğinde uygun temaya yazman yeterli; yeni tema da açabilirsin.
temalar:
  "Yarı iletken ve AI çipleri": [NVDA, AMD, AVGO, TSM, QCOM, MU, MRVL, KLAC, TER, ONTO, CRDO, ALMU]
  "AI altyapı, ağ ve bulut": [ANET, NBIS, NET, AKAM, LPTH]
  "Yazılım ve AI platformları": [PLTR, NOW, TEM, ANTW]
  "Siber güvenlik": [CRWD, PANW, FTNT]
  "Enerji ve elektrifikasyon": [VRT, GEV, ETN, PWR, VST, CEG, BE, SMR]
  "Uzay": [SPCX, RKLB, ASTS, PL, LUNR]
  "Savunma ve drone": [KTOS, AVAV, LMT, UMAC, ONDS, RCAT]
  "Robotik ve otomasyon": [ISRG, SYM, TSLA]
  "Kuantum": [INFQ]
  "Fintek ve tokenizasyon": [SECZ]

# Karne ağırlıkları (%)
karne_agirliklari: {Büyüme: 20, Kârlılık: 20, Bilanço: 10, Değerleme: 20, Trend: 15, Beklenti: 15}

# Adil değer varsayımları
degerleme:
  hedef_peg: 1.5          # F/K–büyüme yönteminde hedef F/K = PEG × beklenen büyüme
  fk_min: 12
  fk_max: 45
  iskonto: 0.10           # DCF iskonto oranı
  terminal_buyume: 0.03
  dcf_max_buyume: 0.30    # DCF ilk yıl büyümesinin üst sınırı
  uc_deger_sinir: 100     # Fiyattan bu kadar %'den fazla sapan yöntem "uç değer" sayılır, harmana girmez
