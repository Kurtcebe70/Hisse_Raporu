# ============================================================
#  YATIRIM TEZLERİN (MODEL V7.0)
#  Her hisse için kendi tezini, izleyeceğin göstergeleri ve
#  "tez bozulursa" kurallarını yaz. Rapor bu kuralları her gün kontrol eder.
#
#  kurallar -> metrik adları:
#    ciro_buyume, eps_buyume, brut_marj, faaliyet_marj, net_marj, fcf_marj, roe,
#    fk, fk_ileri, peg, trend_skoru, rsi, zirveden, adil_deger_fark, karne
#  op: "<" (değer bunun altına düşerse UYARI) veya ">" (üstüne çıkarsa UYARI)
#
#  maliyet / adet: isteğe bağlı, pozisyon kâr/zararını göstermek için
#  (başındaki "# " işaretini silip doldur; ondalık için nokta kullan: 228.20)
#
#  Aşağıdaki kural eşikleri başlangıç için konmuş örneklerdir — kendine göre değiştir.
# ============================================================

SPCX:
  tema: "Uzay (SpaceX)"
  tez: "BURAYA KENDİ TEZİNİ YAZ"
  izlenecek:
    - "Ciro büyümesi"
  kurallar:
    - {ad: "Ciro büyümesi %15 altı", metrik: ciro_buyume, op: "<", deger: 15}
    - {ad: "Zirveden %35'ten fazla düşüş", metrik: zirveden, op: "<", deger: -35}
  # maliyet: 0
  # adet: 0

VRT:
  tema: "Veri merkezi güç/soğutma"
  tez: "BURAYA KENDİ TEZİNİ YAZ"
  kurallar:
    - {ad: "Ciro büyümesi %10 altı", metrik: ciro_buyume, op: "<", deger: 10}
    - {ad: "Trend skoru 40 altı", metrik: trend_skoru, op: "<", deger: 40}
  # maliyet: 0
  # adet: 0

