    - {ad: "Ciro büyümesi %20 altı", metrik: ciro_buyume, op: "<", deger: 20}
    - {ad: "Trend skoru 40 altı", metrik: trend_skoru, op: "<", deger: 40}
  # maliyet: 0
  # adet: 0

